    #fotoModalOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 9999; align-items: center; justify-content: center; }

function formatarDataHora(iso) {
    if (!iso) return "";
    const d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    const dia = String(d.getDate()).padStart(2, "0");
    const mes = String(d.getMonth() + 1).padStart(2, "0");
    const ano = d.getFullYear();
    const hora = String(d.getHours()).padStart(2, "0");
    const min = String(d.getMinutes()).padStart(2, "0");
    return `${dia}/${mes}/${ano} ${hora}:${min}`;
}

function atualizarDisplayData(campo) {
    const el = document.getElementById(campo);
    if (el) el.value = datasAutomaticas[campo] ? formatarDataHora(datasAutomaticas[campo]) : "";
}

function definirDataAutomatica(campo) {
    if (!datasAutomaticas[campo]) {
        datasAutomaticas[campo] = new Date().toISOString();
        atualizarDisplayData(campo);
    }
}

function mostrarErro(msg) {
    const box = document.getElementById('errorBanner');
    box.innerText = msg;
    box.style.display = 'block';
    document.getElementById('okBanner').style.display = 'none';
    window.scrollTo(0, 0);
}

function mostrarOk(msg) {
    const box = document.getElementById('okBanner');
    box.innerText = msg;
    box.style.display = 'block';
    document.getElementById('errorBanner').style.display = 'none';
    setTimeout(() => { box.style.display = 'none'; }, 3500);

    document.getElementById('errorBanner').style.display = 'none';

function ampliarFoto(url) {
    document.getElementById('fotoModalImg').src = url;

    document.getElementById('fotoModalOverlay').classList.remove('aberto');

function previewFoto() {
    const input = document.getElementById('fotoInput');
    const box = document.getElementById('fotoPreviewBox');
    fotoSelecionada = input.files[0] || null;
    box.innerHTML = "";
    if (fotoSelecionada) {
        const img = document.createElement('img');
        img.className = 'foto-preview';
        img.src = URL.createObjectURL(fotoSelecionada);
        box.appendChild(img);
    } else if (fotoUrlAtual) {
        const img = document.createElement('img');
        img.className = 'foto-preview';
        img.src = fotoUrlAtual;
        box.appendChild(img);
    } else {

    }
}

function toggleFields() {
    document.querySelectorAll('.field').forEach(f => f.classList.remove('show'));
    const si = document.getElementById('status_interno').value;
    const sc = document.getElementById('status_costura').value;
    const sa = document.getElementById('status_acabamento').value;
    const se = document.getElementById('status_entrega').value;
    (camposInternos[si] || []).forEach(id => document.getElementById(id).classList.add('show'));
    (camposCostura[sc] || []).forEach(id => document.getElementById(id).classList.add('show'));
    (camposAcabamento[sa] || []).forEach(id => document.getElementById(id).classList.add('show'));
    (camposEntrega[se] || []).forEach(id => document.getElementById(id).classList.add('show'));
    (autoInternos[si] || []).forEach(definirDataAutomatica);
    (autoAcabamento[sa] || []).forEach(definirDataAutomatica);
    (autoEntrega[se] || []).forEach(definirDataAutomatica);
}

function getFormData() {
    const ids = ["material","acessorio","candidato","cargo","numero","estado","cnpj_fornecedor","cnpj_candidato","tiragem","quantidade",
        "status_interno",
        "status_costura","nome_costureira","celular_costureira","data_inicio_costura","data_termino_costura",
        "status_acabamento","nome_acabamento","celular_acabamento",
        "destino","status_entrega","nome_entregador","celular_entregador","nome_destinatario","celular_destinatario"];
    const data = {};
    ids.forEach(id => {
        let v = document.getElementById(id).value;
        if (v === "") v = null;
        if ((id === "tiragem" || id === "quantidade") && v !== null) v = parseInt(v);
        data[id] = v;
    });
    idsAutoData.forEach(id => { data[id] = datasAutomaticas[id] || null; });
    return data;
}

function limparFormulario() {
    document.querySelectorAll('input').forEach(i => i.value = "");
    document.getElementById('material').selectedIndex = 0;
    document.getElementById('cargo').value = "";
    document.getElementById('acessorio').value = "";
    document.getElementById('cnpj_fornecedor').value = "";
    document.getElementById('status_interno').value = "";
    document.getElementById('status_costura').value = "";
    document.getElementById('status_acabamento').value = "";
    document.getElementById('status_entrega').value = "";
    datasAutomaticas = {};
    idsAutoData.forEach(atualizarDisplayData);
    definirDataAutomatica('data_pedido');
    toggleFields();
    editandoId = null;
    fotoSelecionada = null;
    fotoUrlAtual = null;
    document.getElementById('fotoPreviewBox').innerHTML = "Nenhuma foto selecionada";
    document.getElementById('formTitle').innerText = "Novo Pedido";
    document.getElementById('btnSalvar').innerText = "Salvar Pedido";
    esconderErro();
}

async function salvarPedido() {
    esconderErro();
    const data = getFormData();
    if (!data.candidato) { mostrarErro("Preencha o nome do candidato."); return; }

    const btn = document.getElementById('btnSalvar');
    btn.disabled = true;
    btn.innerText = "Salvando...";

    try {
        if (fotoSelecionada) {
            const nomeArquivo = Date.now() + "_" + fotoSelecionada.name.replace(/\s+/g, "_");
            const { error: uploadError } = await sb.storage.from('fotos_pedidos').upload(nomeArquivo, fotoSelecionada);
            if (uploadError) { mostrarErro("Erro ao enviar foto: " + uploadError.message); return; }
            const { data: urlData } = sb.storage.from('fotos_pedidos').getPublicUrl(nomeArquivo);
            data.foto_url = urlData.publicUrl;
        } else if (fotoUrlAtual) {
            data.foto_url = fotoUrlAtual;
        }

        let error;
        if (editandoId) {
            ultimaEdicaoLocal = { id: editandoId, ts: Date.now() };
            ({ error } = await sb.from('controle_campanha').update(data).eq('id', editandoId));
        } else {
            ({ error } = await sb.from('controle_campanha').insert([data]));
        }

        if (error) { mostrarErro("Erro ao salvar no banco: " + error.message); return; }
        mostrarOk("Pedido salvo com sucesso.");
        limparFormulario();
        carregarPedidos();
    } catch (e) {
        mostrarErro("Falha inesperada ao salvar: " + (e && e.message ? e.message : String(e)));
    } finally {
        btn.disabled = false;
        btn.innerText = editandoId ? "Salvar Alteracoes" : "Salvar Pedido";
    }
}

function iniciarBarraProgresso() {
    const container = document.getElementById('barraCarregamentoContainer');
    const barra = document.getElementById('barraCarregamento');
    const texto = document.getElementById('barraCarregamentoTexto');
    container.classList.add('ativa');
    let pct = 0;
    barra.style.width = "0%";
    texto.innerText = "0%";
    const intervalo = setInterval(() => {
        // sobe rapido no comeco e desacelera perto de 90%, esperando os dados chegarem
        const passo = pct < 60 ? (Math.random() * 18 + 7) : (Math.random() * 5 + 1);
        pct = Math.min(pct + passo, 90);
        barra.style.width = pct.toFixed(0) + "%";
        texto.innerText = pct.toFixed(0) + "%";
    }, 180);
    return function finalizar() {
        clearInterval(intervalo);
        barra.style.width = "100%";
        texto.innerText = "100%";
        setTimeout(() => { container.classList.remove('ativa'); }, 350);
    };
}

async function carregarPedidos() {
    document.getElementById('loadingMsg').style.display = 'block';
    const finalizarBarra = iniciarBarraProgresso();
    try {
        const { data, error } = await sb.from('controle_campanha').select('*').order('id', { ascending: false });
        if (error) { mostrarErro("Erro ao carregar dados: " + error.message); return; }
        pedidosCache = data;
        renderizarPedidos(pedidosCache);
    } catch (e) {
        mostrarErro("Falha inesperada ao carregar pedidos: " + (e && e.message ? e.message : String(e)));
    } finally {
        document.getElementById('loadingMsg').style.display = 'none';
        finalizarBarra();
    }
}

function renderizarPedidos(lista) {
    const container = document.getElementById('listaPedidos');
    container.innerHTML = "";
    if (lista.length === 0) {
        container.innerHTML = "<p style='color:#888;'>Nenhum pedido encontrado.</p>";
        return;
    }
    lista.forEach(p => {
        const div = document.createElement('div');
        div.className = 'pedido-item';
        div.innerHTML = `
            <div class="pedido-header">
                <strong>${p.candidato}</strong>
                <span>
                    ${p.status_interno ? `<span class="badge b-int">${p.status_interno}</span>` : ""}
                    ${p.status_costura ? `<span class="badge b-cos">${p.status_costura}</span>` : ""}
                    ${p.status_acabamento ? `<span class="badge b-cos">${p.status_acabamento}</span>` : ""}
                    ${p.status_entrega ? `<span class="badge b-ent">${p.status_entrega}</span>` : ""}
                </span>
            </div>
            <div class="pedido-detalhes">
                Material: ${p.material || "-"} | Acessorio: ${p.acessorio || "-"}<br>
                Cargo: ${p.cargo || "-"} | Numero: ${p.numero || "-"} | Estado: ${p.estado || "-"}<br>
                CNPJ Fornecedor: ${p.cnpj_fornecedor || "-"}<br>
                CNPJ Candidato: ${p.cnpj_candidato || "-"}<br>
                Tiragem: ${p.tiragem || "-"} | Quantidade: ${p.quantidade || "-"}<br>
                Data do Pedido: ${formatarDataHora(p.data_pedido) || "-"} | Destino: ${p.destino || "-"}
                ${p.nome_destinatario ? `<br>Destinatario: ${p.nome_destinatario} - ${p.celular_destinatario || "-"}` : ""}
                ${p.foto_url ? `<br><img class="pedido-foto" src="${p.foto_url}" onerror="this.style.display='none'" onclick="ampliarFoto('${p.foto_url}')">` : ""}
            </div>
            <div class="pedido-acoes">
                <button onclick="editarPedido(${p.id})">Editar</button>
                <button class="secondary" onclick="gerarPDF(${p.id})">Baixar PDF</button>
                <button class="danger" onclick="excluirPedido(${p.id})">Excluir</button>
            </div>
        `;
        container.appendChild(div);
    });
}

function editarPedido(id) {
    const p = pedidosCache.find(x => x.id === id);
    if (!p) return;
    datasAutomaticas = {};
    idsAutoData.forEach(campo => {
        datasAutomaticas[campo] = p[campo] || null;
        atualizarDisplayData(campo);
    });
    Object.keys(p).forEach(key => {
        if (idsAutoData.includes(key)) return;
        const el = document.getElementById(key);
        if (el) el.value = p[key] || "";
    });
    toggleFields();
    editandoId = id;
    fotoSelecionada = null;
    fotoUrlAtual = p.foto_url || null;
    document.getElementById('fotoInput').value = "";
    const box = document.getElementById('fotoPreviewBox');
    box.innerHTML = "";
    if (fotoUrlAtual) {
        const img = document.createElement('img');
        img.className = 'foto-preview';
        img.src = fotoUrlAtual;
        box.appendChild(img);
    } else {
        box.innerText = "Nenhuma foto selecionada";
    }
    document.getElementById('formTitle').innerText = "Editando Pedido #" + id;
    document.getElementById('btnSalvar').innerText = "Salvar Alteracoes";
    esconderErro();
    window.scrollTo(0, 0);
}

async function excluirPedido(id) {
    if (!confirm("Tem certeza que deseja excluir este pedido?")) return;
    try {
        const { error } = await sb.from('controle_campanha').delete().eq('id', id);
        if (error) { mostrarErro("Erro ao excluir: " + error.message); return; }
        carregarPedidos();
    } catch (e) {
        mostrarErro("Falha inesperada ao excluir: " + (e && e.message ? e.message : String(e)));
    }
}

function filtrarPedidos() {
    const termo = document.getElementById('searchBox').value.toLowerCase();
    const filtrado = pedidosCache.filter(p => (p.candidato || "").toLowerCase().includes(termo));
    renderizarPedidos(filtrado);
}

async function urlParaBase64(url) {
    const resp = await fetch(url);
    const blob = await resp.blob();
    return await new Promise((res, rej) => {
        const r = new FileReader();
        r.onload = () => res(r.result);
        r.onerror = rej;
        r.readAsDataURL(blob);
    });
}

async function gerarPDF(id) {
    const p = pedidosCache.find(x => x.id === id);
    if (!p) return;

    try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        doc.setProperties({ title: "Pedido " + p.id });
        // Impede que qualquer tabela crie uma pagina nova - tudo fica sempre numa unica folha A4
        if (doc.autoTable && doc.autoTable.previous !== undefined) { /* noop */ }
        const pageWidth = doc.internal.pageSize.getWidth();
        const pageHeight = doc.internal.pageSize.getHeight();
        const cinzaHeader = [211, 211, 211];
        const pretoTexto = [20, 20, 20];
        const margemEsq = 15;
        const margemDir = 15;
        const larguraUtil = pageWidth - margemEsq - margemDir;

        // Desenha uma imagem respeitando a proporcao original (sem esticar), centralizada dentro da caixa
        function desenharImagemContida(base64, x, y, w, h) {
            let propriedades;
            try {
                propriedades = doc.getImageProperties(base64);
            } catch (e) {
                return false;
            }
            const razaoCaixa = w / h;
            const razaoImg = propriedades.width / propriedades.height;
            let drawW, drawH;
            if (razaoImg > razaoCaixa) {
                // imagem mais larga que a caixa -> encaixa pela largura
                drawW = w;
                drawH = w / razaoImg;
            } else {
                // imagem mais alta que a caixa -> encaixa pela altura
                drawH = h;
                drawW = h * razaoImg;
            }
            const drawX = x + (w - drawW) / 2;
            const drawY = y + (h - drawH) / 2;
            let formato = 'JPEG';
            if (base64.indexOf('image/png') !== -1) formato = 'PNG';
            doc.addImage(base64, formato, drawX, drawY, drawW, drawH);
            return true;
        }

        // Foto do pedido (bloco superior esquerdo)
        const fotoX = margemEsq, fotoY = 14, fotoW = 55, fotoH = 65;
        doc.setDrawColor(180, 180, 180);
        doc.setFillColor(250, 250, 250);
        doc.rect(fotoX, fotoY, fotoW, fotoH, 'FD');
        if (p.foto_url) {
            try {
                const fotoBase64 = await urlParaBase64(p.foto_url);
                const ok = desenharImagemContida(fotoBase64, fotoX + 1, fotoY + 1, fotoW - 2, fotoH - 2);
                if (!ok) throw new Error("nao foi possivel ler a imagem");
            } catch (e) {
                doc.setTextColor(150, 150, 150);
                doc.setFontSize(8);
                doc.text("Foto indisponivel", fotoX + fotoW / 2, fotoY + fotoH / 2, { align: 'center' });
            }
        } else {
            doc.setTextColor(150, 150, 150);
            doc.setFontSize(8);
            doc.text("Sem foto anexada", fotoX + fotoW / 2, fotoY + fotoH / 2, { align: 'center' });
        }

        // Logo e titulo (topo direito)
        const logoX = margemEsq + fotoW + 12, logoY = 14, logoSize = 18;
        try {
            const logoBase64 = await urlParaBase64('./icon-512.png');
            desenharImagemContida(logoBase64, logoX, logoY, logoSize, logoSize);
        } catch (e) {
            console.log("Logo nao carregada:", e);
        }

        const tituloX = logoX + logoSize + 6;
        doc.setTextColor(...pretoTexto);
        doc.setFont(undefined, 'bold');
        doc.setFontSize(16);
        doc.text("CONTROLE DE PRODUÇÃO", tituloX, logoY + 7);
        doc.setFont(undefined, 'normal');
        doc.setFontSize(9);
        doc.text("PEDIDO Nº " + p.id + "  -  DATA " + (formatarDataHora(p.data_pedido) || "-") + "  -  DESTINO " + (p.destino || "-"), tituloX, logoY + 13);

        // Nome do candidato
        const nomeY = logoY + logoSize + 10;
        const nomeX = fotoX + fotoW + 12;
        doc.setFont(undefined, 'bold');
        doc.setFontSize(15);
        doc.text(p.candidato || "-", nomeX, nomeY, { maxWidth: pageWidth - margemDir - nomeX });

        // Badges (cargo, numero, estado)
        let bx = nomeX;
        const by = nomeY + 6;
        const badges = [p.cargo, p.numero ? ("Nº " + p.numero) : null, p.estado].filter(Boolean);
        doc.setFontSize(8.5);
        badges.forEach(txt => {
            const w = doc.getTextWidth(txt) + 7;
            doc.setDrawColor(120, 120, 120);
            doc.setFillColor(...cinzaHeader);
            doc.rect(bx, by, w, 6.5, 'FD');
            doc.setTextColor(...pretoTexto);
            doc.setFont(undefined, 'bold');
            doc.text(txt, bx + 3.5, by + 4.5);
            bx += w + 3;
        });

        // Tabela Identificacao e Material (largura total, abaixo da foto)
        let cursorY = Math.max(fotoY + fotoH, by + 10) + 5;

        function tabela(x, largura, titulo, linhas, startY) {
            doc.autoTable({
                startY: startY,
                margin: { left: x },
                tableWidth: largura,
                head: [[titulo, ""]],
                body: linhas,
                theme: 'grid',
                pageBreak: 'avoid',
                rowPageBreak: 'avoid',
                styles: { fontSize: 8, cellPadding: 1.3, textColor: [30, 30, 30], lineColor: [150, 150, 150] },
                headStyles: { fillColor: cinzaHeader, textColor: [20, 20, 20], fontStyle: 'bold', fontSize: 8.5 },
                columnStyles: { 0: { cellWidth: largura * 0.4, fontStyle: 'bold' }, 1: { cellWidth: largura * 0.6 } },
            });
            return doc.lastAutoTable.finalY;
        }

        cursorY = tabela(margemEsq, larguraUtil, "IDENTIFICAÇÃO E MATERIAL", [
            ["CNPJ Fornecedor", p.cnpj_fornecedor || "-"],
            ["CNPJ Candidato", p.cnpj_candidato || "-"],
            ["Material", p.material || "-"],
            ["Acessorio", p.acessorio || "-"],
            ["Tiragem", String(p.tiragem || "-")],
            ["Quantidade", String(p.quantidade || "-")],
        ], cursorY) + 4;

        // Grade 2x2: Status Interno / Costura na mesma linha, Acabamento / Entrega na linha seguinte
        const largColuna = (larguraUtil - 6) / 2;
        const colDireitaX = margemEsq + largColuna + 6;

        const yInterno = tabela(margemEsq, largColuna, "PRODUÇÃO - STATUS INTERNO", [
            ["Status", p.status_interno || "-"],
            ["Data Exportação", formatarDataHora(p.data_exportacao) || "-"],
            ["Início Impressão", formatarDataHora(p.data_inicio_impressao) || "-"],
            ["Data Impressão", formatarDataHora(p.data_impressao) || "-"],
            ["Início Calandragem", formatarDataHora(p.data_inicio_calandragem) || "-"],
            ["Data Calandragem", formatarDataHora(p.data_calandragem) || "-"],
        ], cursorY);

        const yCostura = tabela(colDireitaX, largColuna, "PRODUÇÃO - COSTURA", [
            ["Status", p.status_costura || "-"],
            ["Responsável", p.nome_costureira || "-"],
            ["Celular", p.celular_costureira || "-"],
            ["Início", formatarDataHora(p.data_inicio_costura) || "-"],
            ["Término", formatarDataHora(p.data_termino_costura) || "-"],
        ], cursorY);

        cursorY = Math.max(yInterno, yCostura) + 4;

        const yAcabamento = tabela(margemEsq, largColuna, "PRODUÇÃO - ACABAMENTO", [
            ["Status", p.status_acabamento || "-"],
            ["Responsável", p.nome_acabamento || "-"],
            ["Celular", p.celular_acabamento || "-"],
            ["Início", formatarDataHora(p.data_inicio_acabamento) || "-"],
            ["Término", formatarDataHora(p.data_termino_acabamento) || "-"],
        ], cursorY);

        const yEntrega = tabela(colDireitaX, largColuna, "PRODUÇÃO - ENTREGA", [
            ["Status", p.status_entrega || "-"],
            ["Entregador", p.nome_entregador || "-"],
            ["Celular", p.celular_entregador || "-"],
            ["Em Rota", formatarDataHora(p.data_inicio_entrega) || "-"],
            ["Destinatário", p.nome_destinatario || "-"],
            ["Celular Dest.", p.celular_destinatario || "-"],
            ["Registro Dest.", formatarDataHora(p.data_confirmacao_destinatario) || "-"],
            ["Entregue em", formatarDataHora(p.data_termino_entrega) || "-"],
        ], cursorY);

        cursorY = Math.max(yAcabamento, yEntrega) + 6;

        // Se o conteudo ultrapassar a altura da folha, remove qualquer pagina extra criada e mantem so a primeira
        while (doc.internal.getNumberOfPages() > 1) {
            doc.deletePage(doc.internal.getNumberOfPages());
        }

        // Rodape
        const rodapeY = Math.min(cursorY, pageHeight - 12);
        doc.setPage(1);
        doc.setDrawColor(200, 200, 200);
        doc.line(margemEsq, rodapeY, pageWidth - margemDir, rodapeY);
        doc.setTextColor(140, 140, 140);
        doc.setFontSize(8);
        doc.setFont(undefined, 'normal');
        const agora = new Date().toLocaleString('pt-BR');
        doc.text("RP Bandeiras - Documento gerado em " + agora, margemEsq, rodapeY + 5);

        const nomeArquivo = "pedido_" + p.candidato.replace(/\s+/g, "_") + ".pdf";
        abrirEscolhaPDF(doc, nomeArquivo);
    } catch (e) {
        mostrarErro("Falha ao gerar PDF: " + (e && e.message ? e.message : String(e)));
    }
}

// Mostra uma escolha explicita: Compartilhar (abre o menu nativo do celular) ou Baixar (download direto do arquivo)
let pdfPendente = null;

function abrirEscolhaPDF(doc, nomeArquivo) {
    pdfPendente = { doc, nomeArquivo };
    document.getElementById('pdfEscolhaOverlay').classList.add('aberto');
}

function fecharEscolhaPDF() {
    document.getElementById('pdfEscolhaOverlay').classList.remove('aberto');
    pdfPendente = null;
}

async function compartilharPDFEscolhido() {
    if (!pdfPendente) return;
    const { doc, nomeArquivo } = pdfPendente;
    fecharEscolhaPDF();
    try {
        const blob = doc.output('blob');
        if (navigator.canShare && navigator.share) {
            const arquivo = new File([blob], nomeArquivo, { type: 'application/pdf' });
            if (navigator.canShare({ files: [arquivo] })) {
                await navigator.share({ files: [arquivo], title: nomeArquivo });
                return;
            }
        }
        mostrarErro("Compartilhamento nao disponivel neste navegador. Use a opcao Baixar.");
    } catch (e) {
        if (e && e.name === 'AbortError') return;
        mostrarErro("Falha ao compartilhar: " + (e && e.message ? e.message : String(e)));
    }
}

function baixarPDFEscolhido() {
    if (!pdfPendente) return;
    const { doc, nomeArquivo } = pdfPendente;
    fecharEscolhaPDF();
    try {
        const blob = doc.output('blob');
        const blobUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = blobUrl;
        link.download = nomeArquivo;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
    } catch (e) {
        mostrarErro("Falha ao baixar: " + (e && e.message ? e.message : String(e)));
    }
}

// Notificacoes entre aparelhos: avisa quando outro dispositivo atualiza um pedido
function notificarAtualizacao(p) {
    const texto = "Pedido de " + (p.candidato || "um candidato") + " foi atualizado.";
    if (window.Notification && Notification.permission === 'granted') {
        try { new Notification("RP Bandeiras", { body: texto, icon: 'icon-192.png' }); } catch (e) { /* ignora */ }
    }
    mostrarOk(texto);
}

function configurarNotificacoesRealtime() {
    if (window.Notification && Notification.permission === 'default') {
        Notification.requestPermission();
    }
    sb.channel('mudancas-controle-campanha')
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'controle_campanha' }, (payload) => {
            const registro = payload.new;
            const fuiEuQueEditei = ultimaEdicaoLocal.id === registro.id && (Date.now() - ultimaEdicaoLocal.ts) < 5000;
            carregarPedidos();
            if (fuiEuQueEditei) return;
            notificarAtualizacao(registro);
        })
        .subscribe();
}

definirDataAutomatica('data_pedido');
toggleFields();
carregarPedidos();
configurarNotificacoesRealtime();
</script>
